# ============================================================
# SmartPing 通用配置出厂模板 (TOML)
#
# 本目录下配置文件的关系：
#   - config.toml       通用配置（服务参数）。启动时读取，Web 界面"保存配置"写回。
#   - config-base.toml  通用配置出厂模板。仅当 config.toml 不存在时，首次启动
#                       会自动复制它为 config.toml（用于恢复出厂设置）。
#   - targets.toml      抓取配置（Ping/TcpPing 检测目标与告警规则）。
#                       缺失时首次启动自动生成默认目标（AliDNS + 本机）。
# ============================================================

Ver = "0.8.0"
Port = 8899
Name = "本机"
Addr = "127.0.0.1"
Toollimit = 0
Authiplist = ""
Password = "smartping"

[Mode]
  Endpoint = ""
  LastSuccTime = ""
  Status = "true"
  Type = "local"

[Base]
  Archive = 10
  Refresh = 1
  Timeout = 5

[Topology]
  Tline = "1"
  Tsound = "/alert.mp3"
  Tsymbolsize = "70"

[Alert]
  EmailHost = ""
  RevcEmailList = ""
  SendEmailAccount = ""
  SendEmailPassword = ""

